name: Devin Review Gate

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  evaluate-devin-findings:
    name: Devin AI - Quality Gate (Strict)
    runs-on: ubuntu-latest

    steps:
      - name: Verificar hallazgos de devin-ai-integration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          echo "🔍 Evaluando revisión publicada en el PR #$PR_NUM..."

          DEVIN_COMMENTS=$(gh api "repos/$REPO/pulls/$PR_NUM/comments" \
            --jq '[.[] | select(.user.login | startswith("devin-ai"))] | length')

          echo "📊 Total de problemas encontrados por Devin: $DEVIN_COMMENTS"

          if [ "$DEVIN_COMMENTS" -gt 0 ]; then
            echo "❌ Se rechazó el Check: devin-ai-integration encontró $DEVIN_COMMENTS problema(s) en el código."
            echo "### ❌ Devin Quality Gate: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "El bot **devin-ai-integration** detectó **$DEVIN_COMMENTS** vulnerabilidad(es) o bug(s) en las líneas del PR." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Sin observaciones activas de Devin."
            echo "### ✅ Devin Quality Gate: PASSED" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi