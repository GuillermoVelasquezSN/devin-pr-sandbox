name: Devin Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  evaluate-devin-findings:
    name: Devin AI - Quality Gate (Strict)
    runs-on: ubuntu-latest

    steps:
      - name: Esperar análisis de Devin y verificar hallazgos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "🔍 Evaluando PR #$PR_NUM (Disparado por: $EVENT_NAME)..."

          # Si el PR recién se abrió o actualizó, damos margen para que Devin Cloud termine de comentar
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "⏳ Esperando a que devin-ai-integration publique su revisión automática..."
            for i in {1..12}; do
              DEVIN_COMMENTS=$(gh api "repos/$REPO/pulls/$PR_NUM/comments" \
                --jq '[.[] | select(.user.login | startswith("devin-ai"))] | length')
              
              if [ "$DEVIN_COMMENTS" -gt 0 ]; then
                echo "⚡ Comentarios de Devin detectados en el intento $i."
                break
              fi
              echo "Intento $i/12: Aún sin comentarios, esperando 10s..."
              sleep 10
            done
          fi

          # Conteo final de comentarios inline dejados por el bot de Devin
          DEVIN_COMMENTS=$(gh api "repos/$REPO/pulls/$PR_NUM/comments" \
            --jq '[.[] | select(.user.login | startswith("devin-ai"))] | length')

          echo "📊 Total de problemas encontrados por Devin: $DEVIN_COMMENTS"

          if [ "$DEVIN_COMMENTS" -gt 0 ]; then
            echo "❌ Se rechazó el Check: devin-ai-integration encontró $DEVIN_COMMENTS problema(s) en el código."
            echo "### ❌ Devin Quality Gate: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "El bot **devin-ai-integration** detectó **$DEVIN_COMMENTS** vulnerabilidad(es) o bug(s) en las líneas del PR." >> $GITHUB_STEP_SUMMARY
            echo "Resuelve o corrige las observaciones antes de hacer merge." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Sin observaciones activas de Devin."
            echo "### ✅ Devin Quality Gate: PASSED" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi