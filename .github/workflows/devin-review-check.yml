name: Devin Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

# Ensures that any new push or submitted review cancels previous runs and updates a single check
concurrency:
  group: devin-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  evaluate-devin-findings:
    name: Devin AI - Quality Gate (Strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request' ||
      startsWith(github.event.review.user.login, 'devin')

    steps:
      - name: Evaluate active review threads from Devin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUM: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          BOT_PREFIX: "devin-ai"
          MAX_WAIT_ATTEMPTS: 24
          WAIT_SECONDS: 10
        run: |
          set -euo pipefail
          echo "Evaluating PR #$PR_NUM (Triggered by event: $EVENT_NAME)..."

          THREADS_QUERY='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) {
                    nodes {
                      isResolved
                      isOutdated
                      comments(first: 1) {
                        nodes {
                          author {
                            login
                          }
                        }
                      }
                    }
                  }
                }
              }
            }'

          DEVIN_FOUND=0

          # If triggered by a code push, wait for Devin's review signal (fail closed on timeout)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Waiting for Devin to analyze the new commit..."
            for i in $(seq 1 "$MAX_WAIT_ATTEMPTS"); do
              DEVIN_PRESENT=$(gh api graphql -f query="$THREADS_QUERY" \
                -f owner="$OWNER" -f name="$REPO_NAME" -F pr="$PR_NUM" \
                --jq "[.data.repository.pullRequest.reviewThreads.nodes[] | select(.comments.nodes[0].author.login | startswith(\"$BOT_PREFIX\"))] | length")

              if [ "$DEVIN_PRESENT" -gt 0 ]; then
                echo "Devin review threads detected after $((i * WAIT_SECONDS)) seconds."
                DEVIN_FOUND=1
                break
              fi
              sleep "$WAIT_SECONDS"
            done

            if [ "$DEVIN_FOUND" -eq 0 ]; then
              echo "Devin review was not detected after $((MAX_WAIT_ATTEMPTS * WAIT_SECONDS)) seconds."
              echo "### :warning: Devin Quality Gate: NO REVIEW DETECTED" >> $GITHUB_STEP_SUMMARY
              echo "Devin did not post any review within the wait window. Failing closed." >> $GITHUB_STEP_SUMMARY
              echo "If Devin Review is not expected on this PR, re-run or adjust BOT_PREFIX." >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          fi

          # Count only unresolved and non-outdated review threads created by the Devin bot
          ACTIVE_ISSUES=$(gh api graphql -f query="$THREADS_QUERY" \
            -f owner="$OWNER" -f name="$REPO_NAME" -F pr="$PR_NUM" \
            --jq "[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false and .isOutdated == false) | select(.comments.nodes[0].author.login | startswith(\"$BOT_PREFIX\"))] | length")

          echo "Total active issues found by Devin: $ACTIVE_ISSUES"

          if [ "$ACTIVE_ISSUES" -gt 0 ]; then
            echo "Check rejected: Devin has $ACTIVE_ISSUES active issue(s) in the code."
            echo "### :x: Devin Quality Gate: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "The Devin review bot has **$ACTIVE_ISSUES** unresolved thread(s) in this PR." >> $GITHUB_STEP_SUMMARY
            echo "Fix the reported issues, or mark false positives as **Resolved** in the conversation." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "No active issues reported by Devin."
            echo "### :white_check_mark: Devin Quality Gate: PASSED" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
