name: Devin Review Gate

on:
  # Se dispara cuando el bot de Devin publica su revisión o comentarios en el PR
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  evaluate-devin-findings:
    name: Devin AI - Quality Gate (Strict)
    runs-on: ubuntu-latest
    # Sin continue-on-error para que sí pueda marcar la EQUIS ROJA (X)

    steps:
      - name: Verificar hallazgos de devin-ai-integration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          echo "🔍 Verificando comentarios de revisión de devin-ai-integration en el PR #$PR_NUM..."

          # Consultamos a la API de GitHub cuántos comentarios inline ha dejado el bot de Devin en este PR
          DEVIN_COMMENTS=$(gh api "repos/$REPO/pulls/$PR_NUM/comments" \
            --jq '[.[] | select(.user.login == "devin-ai-integration[bot]")] | length')

          echo "Comentarios de problemas encontrados por Devin: $DEVIN_COMMENTS"

          if [ "$DEVIN_COMMENTS" -gt 0 ]; then
            echo "❌ Se rechazó el Check: devin-ai-integration encontró $DEVIN_COMMENTS problema(s) en el código."
            echo "### ❌ Devin Quality Gate: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "El bot **devin-ai-integration** detectó **$DEVIN_COMMENTS** vulnerabilidad(es) o bug(s) en las líneas del PR." >> $GITHUB_STEP_SUMMARY
            echo "Resuelve o corrige las observaciones antes de hacer merge." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Sin observaciones activas de Devin."
            echo "### ✅ Devin Quality Gate: PASSED" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
