name: Devin Review (Advisory Check)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  devin-review-link:
    name: Devin AI - Advisory Review
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Generar acceso a Devin Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          REVIEW_URL="https://devinreview.com/$REPO/pull/$PR_NUM"
          
          echo "### 🤖 Devin Review (Modo Consultivo)" >> $GITHUB_STEP_SUMMARY
          echo "Este check es informativo y no bloquea el merge del PR." >> $GITHUB_STEP_SUMMARY
          echo "👉 **[Abrir análisis interactivo en Devin Review]($REVIEW_URL)**" >> $GITHUB_STEP_SUMMARY

          gh pr comment $PR_NUM --repo $REPO --body "🤖 **Devin Advisory Check listo:** Puedes revisar el análisis inteligente de este PR (bugs, seguridad y agrupación lógica de cambios) entrando aquí: [Ver en Devin Review]($REVIEW_URL)"
