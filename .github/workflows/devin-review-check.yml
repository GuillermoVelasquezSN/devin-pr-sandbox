name: Devin Review Gate

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  evaluate-devin-findings:
    name: Devin AI - Quality Gate (Strict)
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate Devin AI review findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          echo "Evaluating published review on PR #$PR_NUM..."

          DEVIN_COMMENTS=$(gh api "repos/$REPO/pulls/$PR_NUM/comments" \
            --jq '[.[] | select(.user.login | startswith("devin-ai"))] | length')

          echo "Total issues found by Devin: $DEVIN_COMMENTS"

          if [ "$DEVIN_COMMENTS" -gt 0 ]; then
            echo "❌ Check rejected: devin-ai-integration found $DEVIN_COMMENTS issue(s) in the code."
            echo "### ❌ Devin Quality Gate: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "The **devin-ai-integration** bot detected **$DEVIN_COMMENTS** vulnerability or bug comment(s) in this PR." >> $GITHUB_STEP_SUMMARY
            echo "Please resolve or fix the reported issues before merging." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No active issues reported by Devin."
            echo "### ✅ Devin Quality Gate: PASSED" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi