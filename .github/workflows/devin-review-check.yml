name: Devin Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: devin-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  evaluate-devin-findings:
    name: Devin AI - Quality Gate (Strict)
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate active review threads from Devin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          echo "Evaluating PR #$PR_NUM..."

          echo "Waiting for Devin Cloud to analyze the new commit..."
          # Poll every 5 seconds (up to 50s) to see if Devin started commenting
          for i in {1..10}; do
            DEVIN_PRESENT=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $pr: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr) {
                    reviewThreads(first: 50) {
                      nodes {
                        comments(first: 1) {
                          nodes {
                            author {
                              login
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }' -f owner="$OWNER" -f name="$REPO_NAME" -F pr="$PR_NUM" \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.comments.nodes[0].author.login | startswith("devin-ai"))] | length')

            if [ "$DEVIN_PRESENT" -gt 0 ]; then
              echo "Devin review threads detected after $((i * 5)) seconds."
              break
            fi
            sleep 5
          done

          # Count only unresolved and non-outdated review threads created by Devin
          ACTIVE_ISSUES=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) {
                    nodes {
                      isResolved
                      isOutdated
                      comments(first: 1) {
                        nodes {
                          author {
                            login
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f name="$REPO_NAME" -F pr="$PR_NUM" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false and .isOutdated == false) | select(.comments.nodes[0].author.login | startswith("devin-ai"))] | length')

          echo "Total active issues found by Devin: $ACTIVE_ISSUES"

          if [ "$ACTIVE_ISSUES" -gt 0 ]; then
            echo "❌ Check rejected: devin-ai-integration has $ACTIVE_ISSUES active issue(s) in the code."
            echo "### ❌ Devin Quality Gate: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "The **devin-ai-integration** bot has **$ACTIVE_ISSUES** active vulnerability or bug thread(s) in this PR." >> $GITHUB_STEP_SUMMARY
            echo "Please resolve or fix the reported issues before merging." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No active issues reported by Devin."
            echo "### ✅ Devin Quality Gate: PASSED" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi